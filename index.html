 if(!S.share){S.share=Array.from({length:5},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');keep()}
 pushLive();
 const keepIt=await box(tr('Game code: {0}\nShare it with the other players: ☰ → Enter code.',S.share),tr('OK'),tr('Stop sharing'));
 if(!keepIt){fetch(liveUrl(S.share),{method:'DELETE'}).catch(()=>{});delete S.share;keep()}}
async function joinGame(){if(!LIVE_URL)return box(tr('Online sharing is not set up yet.'));
 if(WATCH)stopWatch(true);
 const ov=$('#ov');ov.hidden=false;
 ov.innerHTML=`<div class="dlg"><h3>${tr('Enter code')}</h3><input id="jc" maxlength="8" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;text-align:center;font-size:22px;letter-spacing:4px;margin:10px 0"><div class="note" id="jn"></div><div class="row"><button class="b" id="jg">${tr('View')}</button><button class="b gh" id="jx">${tr('Cancel')}</button></div></div>`;
 $('#jx').onclick=()=>{ov.hidden=true;ov.innerHTML=''};
 const go1=async()=>{const code=$('#jc').value.trim().toUpperCase();if(!code)return;$('#jn').textContent='';
  try{const r=await fetch(liveUrl(code));const d=await r.json();if(!d||!d.s){$('#jn').textContent=tr('Code not found.');return}
   ov.hidden=true;ov.innerHTML='';startWatch(code,d)}catch(e){$('#jn').textContent=tr('Could not connect.')}};
 $('#jg').onclick=go1;$('#jc').onkeydown=e=>{if(e.key=='Enter')go1()};$('#jc').focus()}
function startWatch(code,d){WATCH={code,mine:S,last:d.s,timer:setInterval(pollWatch,3000)};S=JSON.parse(d.s);syncR();render()}
async function pollWatch(){if(!WATCH)return;try{const r=await fetch(liveUrl(WATCH.code));const d=await r.json();
 if(!d||!d.s){if(!WATCH.ended){WATCH.ended=true;render()}return}
 const was=WATCH.ended;WATCH.ended=false;if(d.s!==WATCH.last||was){WATCH.last=d.s;S=JSON.parse(d.s);syncR();render()}}catch(e){}}
function stopWatch(quiet){if(!WATCH)return;clearInterval(WATCH.timer);S=WATCH.mine;WATCH=null;syncR();if(!quiet){if(S&&S.cfg){render();setTimeout(go,300)}else setup()}}
function menu(w){$('#mn').hidden=true;if(w=='stats')stats();else if(w=='lang')setLang();else if(w=='share')shareGame();else if(w=='join')joinGame();else newGame()}
async function newGame(){if(WATCH)stopWatch(true);if(S&&S.share&&LIVE_URL)fetch(liveUrl(S.share),{method:'DELETE'}).catch(()=>{});if(S&&S.results.length<TOTAL&&(S.results.length||S.bids.some(b=>b!=null))&&!(await box(tr('Start a new game?\nThe current unfinished game will be lost.'),tr('Start new'),tr('Cancel'))))return;localStorage.removeItem('joker_state');setup()}
$('#mn').innerHTML=menuHTML();
S&&S.cfg?(render(),setTimeout(go,300)):setup();
